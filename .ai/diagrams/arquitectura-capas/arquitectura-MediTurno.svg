<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="capaCliente" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f2fd"/><stop offset="1" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="capaBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f5e9"/><stop offset="1" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="capaBD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3e0"/><stop offset="1" stop-color="#ffe0b2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#455a64"/>
    </marker>
    <filter id="sombra" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="900" fill="#fafafa"/>

  <!-- ================= TÍTULO ================= -->
  <rect x="0" y="0" width="1200" height="70" fill="#0d47a1"/>
  <text x="600" y="30" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">Arquitectura del Sistema MediTurno</text>
  <text x="600" y="56" text-anchor="middle" fill="#bbdefb" font-size="15">Gestión de Turnos Hospitalarios — Proyecto de Grado</text>

  <!-- ================= INTEGRANTE ================= -->
  <rect x="30" y="82" width="1140" height="34" rx="6" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="600" y="104" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="bold">Integrante: Bladimir Luna Corrales</text>

  <!-- ================= CAPA 1: CLIENTE ================= -->
  <rect x="60" y="150" width="1080" height="180" rx="12" fill="url(#capaCliente)" stroke="#1976d2" stroke-width="2.5" filter="url(#sombra)"/>
  <text x="92" y="182" fill="#0d47a1" font-size="19" font-weight="bold">CAPA CLIENTE — Web</text>
  <text x="92" y="204" fill="#37474f" font-size="13">Tecnología: Navegador web · Bootstrap 5 · JavaScript · Vite · FullCalendar (calendario)</text>

  <!-- Cliente subcomponentes -->
  <rect x="95" y="220" width="300" height="78" rx="8" fill="#ffffff" stroke="#1976d2"/>
  <text x="245" y="248" text-anchor="middle" fill="#0d47a1" font-size="14" font-weight="bold">Vistas Web (Blade)</text>
  <text x="245" y="268" text-anchor="middle" fill="#546e7a" font-size="12">Login · Dashboard · CRUDs</text>
  <text x="245" y="286" text-anchor="middle" fill="#546e7a" font-size="12">Calendario · Reportes</text>

  <rect x="420" y="220" width="300" height="78" rx="8" fill="#ffffff" stroke="#1976d2"/>
  <text x="570" y="248" text-anchor="middle" fill="#0d47a1" font-size="14" font-weight="bold">Interactividad</text>
  <text x="570" y="268" text-anchor="middle" fill="#546e7a" font-size="12">Bootstrap 5 + JavaScript</text>
  <text x="570" y="286" text-anchor="middle" fill="#546e7a" font-size="12">FullCalendar (Vite)</text>

  <rect x="745" y="220" width="300" height="78" rx="8" fill="#ffffff" stroke="#1976d2"/>
  <text x="895" y="248" text-anchor="middle" fill="#0d47a1" font-size="14" font-weight="bold">Formularios</text>
  <text x="895" y="268" text-anchor="middle" fill="#546e7a" font-size="12">Validación (HTML5 + JS)</text>
  <text x="895" y="286" text-anchor="middle" fill="#546e7a" font-size="12">Protección CSRF</text>

  <!-- ================= CONEXIÓN 1: Cliente → Backend (HTTP/HTTPS) ================= -->
  <line x1="600" y1="330" x2="600" y2="408" stroke="#455a64" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="618" y="355" fill="#455a64" font-size="13" font-weight="bold">HTTP / HTTPS</text>
  <text x="618" y="372" fill="#78909c" font-size="12">Peticiones y respuestas</text>
  <text x="618" y="389" fill="#78909c" font-size="12">(JSON para calendario/eventos)</text>

  <!-- ================= CAPA 2: BACKEND ================= -->
  <rect x="60" y="410" width="1080" height="200" rx="12" fill="url(#capaBack)" stroke="#388e3c" stroke-width="2.5" filter="url(#sombra)"/>
  <text x="92" y="442" fill="#1b5e20" font-size="19" font-weight="bold">CAPA BACKEND — Servidor</text>
  <text x="92" y="464" fill="#37474f" font-size="13">Tecnología: PHP 8.2 · Laravel 10 · Servidor Nginx (PHP-FPM)</text>

  <rect x="95" y="480" width="240" height="92" rx="8" fill="#ffffff" stroke="#388e3c"/>
  <text x="215" y="507" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">Nginx</text>
  <text x="215" y="526" text-anchor="middle" fill="#546e7a" font-size="11">Servidor web</text>
  <text x="215" y="543" text-anchor="middle" fill="#546e7a" font-size="11">PHP-FPM</text>
  <text x="215" y="560" text-anchor="middle" fill="#546e7a" font-size="11">Seguridad y headers</text>

  <rect x="365" y="480" width="240" height="92" rx="8" fill="#ffffff" stroke="#388e3c"/>
  <text x="485" y="507" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">Controladores</text>
  <text x="485" y="526" text-anchor="middle" fill="#546e7a" font-size="11">Lógica MVC</text>
  <text x="485" y="543" text-anchor="middle" fill="#546e7a" font-size="11">Form Requests</text>
  <text x="485" y="560" text-anchor="middle" fill="#546e7a" font-size="11">Policies / Middlewares</text>

  <rect x="635" y="480" width="240" height="92" rx="8" fill="#ffffff" stroke="#388e3c"/>
  <text x="755" y="507" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">Modelos (Eloquent)</text>
  <text x="755" y="526" text-anchor="middle" fill="#546e7a" font-size="11">ORM · relaciones</text>
  <text x="755" y="543" text-anchor="middle" fill="#546e7a" font-size="11">Servicios de dominio</text>
  <text x="755" y="560" text-anchor="middle" fill="#546e7a" font-size="11">Auditoría · SoftDeletes</text>

  <rect x="905" y="480" width="200" height="92" rx="8" fill="#ffffff" stroke="#388e3c"/>
  <text x="1005" y="507" text-anchor="middle" fill="#1b5e20" font-size="13" font-weight="bold">Roles</text>
  <text x="1005" y="526" text-anchor="middle" fill="#546e7a" font-size="11">admin</text>
  <text x="1005" y="543" text-anchor="middle" fill="#546e7a" font-size="11">jefe_servicio</text>
  <text x="1005" y="560" text-anchor="middle" fill="#546e7a" font-size="11">personal</text>

  <!-- ================= CONEXIÓN 2: Backend → BD ================= -->
  <line x1="600" y1="610" x2="600" y2="688" stroke="#455a64" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="618" y="635" fill="#455a64" font-size="13" font-weight="bold">MySQL (TCP :3306)</text>
  <text x="618" y="652" fill="#78909c" font-size="12">Eloquent ORM</text>
  <text x="618" y="669" fill="#78909c" font-size="12">Red interna Docker</text>

  <!-- ================= CAPA 3: BASE DE DATOS ================= -->
  <rect x="60" y="690" width="1080" height="150" rx="12" fill="url(#capaBD)" stroke="#f57c00" stroke-width="2.5" filter="url(#sombra)"/>
  <text x="92" y="722" fill="#e65100" font-size="19" font-weight="bold">CAPA BASE DE DATOS</text>
  <text x="92" y="744" fill="#37474f" font-size="13">Tecnología: MySQL 8 (motor de persistencia de datos)</text>

  <rect x="95" y="760" width="330" height="58" rx="8" fill="#ffffff" stroke="#f57c00"/>
  <text x="260" y="784" text-anchor="middle" fill="#e65100" font-size="13" font-weight="bold">MySQL 8</text>
  <text x="260" y="804" text-anchor="middle" fill="#546e7a" font-size="11">Base de datos: mediturno</text>

  <rect x="450" y="760" width="330" height="58" rx="8" fill="#ffffff" stroke="#f57c00"/>
  <text x="615" y="784" text-anchor="middle" fill="#e65100" font-size="13" font-weight="bold">Eloquent ORM</text>
  <text x="615" y="804" text-anchor="middle" fill="#546e7a" font-size="11">Migraciones + consultas parametrizadas</text>

  <rect x="805" y="760" width="300" height="58" rx="8" fill="#ffffff" stroke="#f57c00"/>
  <text x="955" y="784" text-anchor="middle" fill="#e65100" font-size="13" font-weight="bold">Datos del dominio</text>
  <text x="955" y="804" text-anchor="middle" fill="#546e7a" font-size="11">usuarios · turnos · personal</text>

  <!-- ================= FUENTE ================= -->
  <rect x="0" y="858" width="1200" height="42" fill="#eceff1"/>
  <text x="600" y="884" text-anchor="middle" fill="#455a64" font-size="12">Fuente: Sistema MediTurno — software implementado (Elaboración propia; Bladimir Luna Corrales)</text>
</svg>
